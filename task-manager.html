<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>

  <!-- Tailwind via CDN: utility classes with no build step -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body { font-family: "Inter", sans-serif; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .task-enter { animation: rise 0.18s ease-out; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-white text-black">

  <!-- Card container -->
  <div class="w-full max-w-md rounded-3xl bg-white border-2 border-black shadow-[6px_6px_0_0_#000] p-8">

    <!-- Header -->
    <div class="flex items-center justify-between mb-1">
      <h1 class="text-xl font-extrabold tracking-tight text-black">
        Task Manager
      </h1>
      <span id="task-count" class="text-xs font-semibold text-black bg-white border-2 border-black rounded-full px-2.5 py-1">
        0 tasks
      </span>
    </div>
    <p class="text-xs text-neutral-500 mb-6">Stay on top of what matters today</p>

    <!-- New task form -->
    <div class="flex gap-2 mb-6">
      <input id="task-input" type="text" placeholder="Add a task and press Enter..."
        class="flex-1 rounded-2xl bg-white border-2 border-black px-4 py-3 text-sm text-black placeholder-neutral-400
               focus:outline-none focus:ring-2 focus:ring-green-500 transition" />
      <button id="add-btn"
        class="rounded-2xl px-5 py-3 text-sm font-semibold text-white bg-black
               hover:bg-green-600 active:scale-95 transition">
        Add
      </button>
    </div>

    <!-- The container: empty on purpose, JS appendChild's each task in here -->
    <ul id="task-list" class="space-y-2.5 max-h-80 overflow-y-auto pr-1"></ul>

    <!-- Shown when there are no tasks -->
    <p id="empty-state" class="text-center text-sm text-neutral-400 py-10">
      No tasks yet — add your first one above
    </p>

  </div>

  <script src="task-manager.js" defer></script>
</body>
</html>
