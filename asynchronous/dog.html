<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>

  <title>Random Dog</title>
</head>

<body class="bg-stone-100 min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-sm bg-white rounded-3xl border border-stone-200 shadow-sm p-4">

    <!-- Image frame: keeps its square shape even before a dog loads -->
    <div id="frame" class="relative aspect-square rounded-2xl bg-stone-100 overflow-hidden">

      <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-stone-400">
        <svg class="w-10 h-10 mb-2" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="9" r="2" />
          <circle cx="9" cy="5" r="2" />
          <circle cx="15" cy="5" r="2" />
          <circle cx="19" cy="9" r="2" />
          <path d="M12 11c-3 0-6 3.5-6 6.5 0 2 1.5 3 3 3 1.2 0 2-.6 3-.6s1.8.6 3 .6c1.5 0 3-1 3-3 0-3-3-6.5-6-6.5z" />
        </svg>
        <span class="text-sm">No dog yet</span>
      </div>

      <img
        id="dogImage"
        alt="A random dog"
        class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-500"
      />
    </div>

    <div class="px-2 pt-5 pb-2">
      <p class="text-xs font-medium uppercase tracking-wider text-stone-400 mb-1">
        Breed
      </p>
      <h1 id="breed" class="text-2xl font-semibold text-stone-900 capitalize">
        Meet a random dog
      </h1>
      <p id="message" class="text-sm text-stone-500 mt-1">
        Press the button to fetch one from the internet.
      </p>
    </div>

    <button
      id="btn"
      class="w-full mt-4 bg-stone-900 hover:bg-stone-800 active:scale-[0.98] text-white py-3.5 rounded-xl font-medium transition disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Get a dog
    </button>

    <p class="text-center text-xs text-stone-400 mt-4">
      Photos from dog.ceo
    </p>

  </main>

  <script src="dog.js"></script>

</body>
</html>
