<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>

  <title>Random Person</title>
</head>

<body class="bg-stone-100 min-h-screen flex items-center justify-center p-4">

  <main id="card" class="w-full max-w-sm bg-white rounded-3xl border border-stone-200 shadow-sm p-6">

    <!-- Photo and name -->
    <div class="flex flex-col items-center text-center">
      <div class="w-28 h-28 rounded-full bg-stone-100 overflow-hidden ring-4 ring-stone-100 mb-4">
        <img
          id="photo"
          alt="Profile photo"
          class="w-full h-full object-cover opacity-0 transition-opacity duration-500"
        />
      </div>

      <h1 id="name" class="text-2xl font-semibold text-stone-900">
        Meet someone new
      </h1>
      <p id="message" class="text-sm text-stone-500 mt-1">
        Press the button to fetch a random person.
      </p>
    </div>

    <!-- Details -->
    <dl class="mt-6 divide-y divide-stone-100 border-y border-stone-100">
      <div class="flex items-start gap-3 py-3">
        <svg class="w-5 h-5 text-stone-400 mt-0.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 7l9 6 9-6" />
        </svg>
        <div class="min-w-0">
          <dt class="text-xs font-medium uppercase tracking-wider text-stone-400">Email</dt>
          <dd id="email" class="text-sm text-stone-800 break-all">—</dd>
        </div>
      </div>

      <div class="flex items-start gap-3 py-3">
        <svg class="w-5 h-5 text-stone-400 mt-0.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z" />
          <circle cx="12" cy="10" r="2.5" />
        </svg>
        <div class="min-w-0">
          <dt class="text-xs font-medium uppercase tracking-wider text-stone-400">Address</dt>
          <dd id="address" class="text-sm text-stone-800">—</dd>
        </div>
      </div>
    </dl>

    <button
      id="btn"
      class="w-full mt-6 bg-stone-900 hover:bg-stone-800 active:scale-[0.98] text-white py-3.5 rounded-xl font-medium transition disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Get a person
    </button>

    <p class="text-center text-xs text-stone-400 mt-4">
      Data from randomuser.me
    </p>

  </main>

  <script src="person.js"></script>

</body>
</html>
