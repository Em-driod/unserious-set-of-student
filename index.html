<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter</title>

  <!-- Tailwind via CDN: utility classes with no build step -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-8 font-sans  text-slate-100">

  <!-- Card container -->
  <div id="app" class="w-full max-w-sm rounded-3xl bg-white/5 backdrop-blur-md border border-white/10 shadow-2xl p-10 text-center">

    <h1 class="text-sm font-semibold uppercase tracking-[0.3em] text-indigo-300 mb-2">Counter</h1>
    <p class="text-xs text-slate-400 mb-8">Tap the buttons to count</p>

    <!-- The number -->
    <p id="count" class="text-7xl font-black tabular-nums mb-10 bg-gradient-to-r from-indigo-300 to-fuchsia-300 
    bg-clip-text text-transparent">0</p>

    <!-- Buttons -->
    <div class="flex justify-center gap-3">
      <button id="button1" onclick="reduce()"
        class="h-14 w-14 rounded-2xl text-2xl font-bold text-white bg-rose-500/90 hover:bg-rose-500 hover:scale-105 active:scale-95 shadow-lg shadow-rose-500/30 transition">
        &minus;
      </button>

      <button onclick="reset()"
        class="h-14 px-5 rounded-2xl text-sm font-semibold uppercase tracking-wider text-slate-200 bg-white/10 hover:bg-white/20 hover:scale-105 active:scale-95 transition">
        Reset
      </button>

      <button onclick="add()"
        class="h-14 w-14 rounded-2xl text-2xl font-bold text-white bg-emerald-500/90 hover:bg-emerald-500 hover:scale-105 active:scale-95 shadow-lg shadow-emerald-500/30 transition">
        +
      </button>

    </div>

  </div>

  <script src="script.js" defer></script>
</body>
</html>
